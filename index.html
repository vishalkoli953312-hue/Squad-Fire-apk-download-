<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APK डाउनलोड पेज</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #74ebd5, #9face6);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .download-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .app-icon {
            width: 80px;
            height: 80px;
            background: #4e54c8;
            color: white;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            margin: 0 auto 20px;
        }

        h1 {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        /* डाउनलोड बटन का स्टाइल */
        .download-btn {
            display: inline-block;
            background: #4e54c8;
            color: white;
            padding: 12px 35px;
            font-size: 1rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(78, 84, 200, 0.4);
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
        }

        .download-btn:hover {
            background: #3f44b3;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(78, 84, 200, 0.6);
        }

        .download-btn:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

    <div class="download-card">
        <div class="app-icon">🤖</div>
        
        <h1>मेरा प्रीमियम ऐप</h1>
        <p>निचे दिए गए बटन पर क्लिक करके सुरक्षित APK फ़ाइल डाउनलोड करें।</p>
        
        <a href="Squad Fire.apk" download="Squad_Fire_1v.apk" class="download-btn" id="apkBtn">
            अभी डाउनलोड करें
        </a>
    </div>

    <script>
        document.getElementById('apkBtn').addEventListener('click', function(e) {
            // आप चाहें तो यहाँ डाउनलोड पर क्लिक होने के बाद कोई मैसेज दिखा सकते हैं
            console.log("APK डाउनलोड शुरू हो गया है...");
            
            // उदाहरण: डाउनलोड क्लिक होने पर बटन का टेक्स्ट बदलना
            const btn = this;
            btn.innerHTML = "डाउनलोड हो रहा है...";
            btn.style.background = "#28a745"; // बटन का रंग हरा हो जाएगा
            btn.style.boxShadow = "0 4px 15px rgba(40, 167, 69, 0.4)";
            
            // 3 सेकंड बाद बटन को वापस नॉर्मल करना
            setTimeout(() => {
                btn.innerHTML = "अभी डाउनलोड करें";
                btn.style.background = "#4e54c8";
                btn.style.boxShadow = "0 4px 15px rgba(78, 84, 200, 0.4)";
            }, 3000);
        });
    </script>

</body>
</html>
